# Construction et publication de la préproduction sur GitHub Pages
# (https://oiclecxe.github.io/oiclecxe/), d'après la documentation officielle de Hugo
# (gohugo.io, « Host on GitHub Pages »). Réglage du dépôt : Settings › Pages › Source = GitHub Actions.
# Copie de préproduction : toutes les pages en noindex (params.seo.blockRobots).
name: Build and deploy
env:
  HUGO_VERSION: 0.166.0     # même version qu'en local (hugo version)
  NODE_VERSION: 22.23.2     # outils ponctuels : Pagefind
  PAGEFIND_VERSION: 1.5.2
  TZ: Europe/Paris
  HUGO_PARAMS_SEO_BLOCKROBOTS: "true"
on:
  push:
    branches:
      - main
  # Reconstruction chaque nuit (heure UTC : 0 h 10 à Paris en hiver, 1 h 10 en été) pour
  # tout ce qui dépend de la date du jour : ouverture et clôture des formulaires Google
  # (opens/closes), événements et sessions passés. GitHub suspend ce déclenchement après
  # 60 jours sans activité sur le dépôt : le réactiver dans l'onglet Actions.
  schedule:
    - cron: "10 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          hugo version
          node --version

      - name: Configure Git
        run: git config --global core.quotepath false

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      - name: Include the style guide
        # Préproduction seulement : config/production/hugo.toml exclut le guide de style
        # (/styleguide/) du site de production.
        run: rm config/production/hugo.toml

      - name: Build
        run: |
          hugo build \
            --environment production \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: Search index (Pagefind)
        run: npx --yes "pagefind@${PAGEFIND_VERSION}" --site public

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
