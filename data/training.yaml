info:
  - title: "Évaluation de la formation"
    items:
      - "Entretien informel."
      - "Contrôle des connaissances par échange de questions et réponses."
      - "Questionnaire d’évaluation."
      - "Questionnaire de satisfaction sur la formation suivie."
  - title: "Formalités administratives"
    items:
      - "Feuille de présence ou capture d’écran des participants, pour valider leur présence."
      - "Remise d’un certificat de réalisation en fin de stage."
  - title: "Délai d’accès aux formations"
    items:
      - "2 semaines, à confirmer lors de la contractualisation, selon la disponibilité des stagiaires et des formateurs."
  - title: "Accessibilité aux personnes en situation de handicap"
    items:
      - "Contactez votre interlocuteur commercial ou écrivez à [formation@excelcio.com](mailto:formation@excelcio.com), ou appelez le 01 71 19 45 00."

