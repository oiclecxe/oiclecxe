# Redirections des anciennes adresses du site WordPress vers le nouveau site.
# Source : sitemap de https://excelcio.com/ relevé le 27/09/2026 (556 adresses :
# 84 pages, 121 articles, 335 étiquettes, 13 catégories, 3 auteurs).
# Hugo en produit /_redirects (Netlify, Cloudflare Pages) et /redirects.htaccess (exemple Apache).
#
# from   : ancienne adresse (chemin). Un « * » final couvre tout ce qui suit (ex. /tag/*).
#          Une adresse complète (https://…) redirige tout un domaine.
# to     : nouvelle adresse ; « :splat » reprend la partie couverte par « * ».
# status : 301 par défaut (déplacement permanent).
# force  : true = rediriger même si un fichier existe à cette adresse.
# check  : true = correspondance approximative, à vérifier par Excelcio.
#
# Adresses inchangées, sans redirection : /, /a-propos/, /actualites/, /contact/, /offre/,
# /mentions-legales/, /formations/ et les 28 fiches formations (mêmes identifiants).

# Domaine : l'ancien site est servi sans « www » ; le nouveau l'est avec.
- from: "https://excelcio.com/*"
  to: "https://www.excelcio.com/:splat"
  force: true

# Entreprise
- from: /a-propos/societe/
  to: /a-propos/
- from: /a-propos/recrutement/
  to: /recrutement/
- from: /category/jobs/
  to: /recrutement/
- from: /remerciement-candidature/
  to: /recrutement/
  check: true
- from: /author/*
  to: /a-propos/
  check: true

