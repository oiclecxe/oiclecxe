  # ---------------------------------------------------------------- Données
  - name: data
    label: Données du site
    icon: database
    files:
      - name: offices
        label: Bureaux
        file: data/offices.yaml
        fields:
          - name: offices
            label: Bureaux
            label_singular: bureau
            widget: list
            root: true
            summary: "{{city}}"
            hint: "Affichés dans le pied de page, sur la page Contact et dans les données structurées. Adresse inconnue : « [À RÉDIGER — Adresse] », code postal « [XXXXX] »."
            fields:
              - { name: city, label: Ville, widget: string }
              - { name: address, label: Adresse, widget: string }
              - { name: postalCode, label: Code postal, widget: string }
              - { name: phone, label: Téléphone, widget: string, required: false, hint: "Format international, ex. +33 1 71 19 45 00." }
              - { name: access, label: Accès, widget: string, required: false }
      - name: social
        label: Réseaux sociaux
        file: data/social.yaml
        fields:
          - name: social
            label: Réseaux sociaux
            label_singular: réseau
            widget: list
            root: true
            summary: "{{name}}"
            fields:
              - { name: name, label: Nom, widget: string }
              - { name: icon, label: Icône, widget: select, options: [linkedin, x, youtube] }
              - { name: url, label: Adresse, widget: string }
      - name: training
        label: Formations (informations communes et avis)
        file: data/training.yaml
        fields:
          - name: info
            label: Informations complémentaires
            label_singular: bloc
            widget: list
            summary: "{{title}}"
            hint: "Blocs affichés sur chaque fiche formation."
            fields:
              - { name: title, label: Titre, widget: string }
              - { name: items, label: Points, widget: list, hint: "Markdown accepté (liens)." }
          - name: testimonials
            label: Avis de stagiaires
            label_singular: avis
            widget: list
            summary: "{{author}} · {{context}}"
            hint: "Avis réels, affichés sur les fiches des solutions citées."
            fields:
              - { name: text, label: Avis, widget: text }
              - { name: author, label: Auteur, widget: string }
              - { name: context, label: Formation suivie, widget: string, required: false }
              - *solutions
