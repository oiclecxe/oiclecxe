{{- /* Breadcrumb (not on the home page). Context: page. */ -}}
{{- if not .IsHome }}
<nav class="breadcrumb" aria-label="{{ T "breadcrumb" }}">
  <ol>
    {{- range .Ancestors.Reverse }}
    <li><a href="{{ .RelPermalink }}">{{ cond .IsHome (T "home") .LinkTitle }}</a></li>
    {{- end }}
    <li><span aria-current="page">{{ .LinkTitle }}</span></li>
  </ol>
</nav>
{{- end -}}
