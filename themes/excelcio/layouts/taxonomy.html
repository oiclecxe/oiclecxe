{{- define "main" }}
  {{- partial "components/page-hero.html" . }}
  <section class="section tone-dark section--flush-top">
    <div class="container">
      <ul class="grid grid--3" role="list">
        {{- range .Pages }}
        <li>
          <a class="card" href="{{ .RelPermalink }}">
            <h2 class="card__title">{{ .Title }}</h2>
            {{- partialCached "icon.html" (dict "name" "arrow-up-right" "class" "card__corner") "arrow-up-right" "card__corner" }}
            <p class="card__text">{{ T "itemCount" (len .Pages) }}</p>
          </a>
        </li>
        {{- end }}
      </ul>
    </div>
  </section>
{{- end }}
