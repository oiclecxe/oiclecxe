{{- define "main" }}
  <section class="section tone-brand squares-host page-hero">
    {{- partial "components/squares.html" (dict "seed" "404" "cols" 5 "rows" 7) }}
    <div class="container">
      <p class="eyebrow">404</p>
      <h1 class="page-hero__title">{{ T "notFoundTitle" }}</h1>
      <p class="lead page-hero__lead">{{ T "notFoundText" }}</p>
      <div class="btn-row">
        <a class="btn btn--primary" href="{{ "/" | partial "func/rel-url.html" }}">{{ T "backHome" }}</a>
        {{- with site.Params.header.searchURL }}
        <a class="btn btn--secondary" href="{{ . | partial "func/rel-url.html" }}">{{ T "search" }}</a>
        {{- end }}
      </div>
    </div>
  </section>
{{- end }}
