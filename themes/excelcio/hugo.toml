# Thème excelcio — configuration et valeurs par défaut.
# Chaque paramètre est documenté dans themes/excelcio/README.md.
# Le site redéfinit uniquement ce qu'il change (config/_default/params.toml).

[module]
  [module.hugoVersion]
    min = "0.166.0"

# Output formats for search engines and AI agents (Lot 5): see README, "SEO et agents IA".
[mediaTypes]
  [mediaTypes."text/netlify"]
    delimiter = ""
  [mediaTypes."text/x-htaccess"]
    suffixes = ["htaccess"]

[outputFormats]
  # /llms.txt and /llms-full.txt (llmstxt.org)
  [outputFormats.llms]
    baseName = "llms"
    mediaType = "text/plain"
    isPlainText = true
    notAlternative = true
    root = true
  [outputFormats.llmsfull]
    baseName = "llms-full"
    mediaType = "text/plain"
    isPlainText = true
    notAlternative = true
    root = true
  # Redirections read from data/redirects.yaml: Netlify / Cloudflare Pages, and an Apache example.
  [outputFormats.redirects]
    baseName = "_redirects"
    mediaType = "text/netlify"
    isPlainText = true
    notAlternative = true
    root = true
  [outputFormats.htaccess]
    baseName = "redirects"
    mediaType = "text/x-htaccess"
    isPlainText = true
    notAlternative = true
    root = true
# Hugo does not merge `outputs` from a theme: the site enables these formats in its own
# configuration (see README, "SEO et agents IA").

[params]
  description = ""

  [params.logo]
    # Chemins dans assets/. Vides = nom du site affiché en texte.
    default = ""
    onDark = ""
    compactOnDark = ""
    alt = ""

  [params.organization]
    name = ""
    legalName = ""
    registration = ""
    email = ""
    jobsEmail = ""

  [params.header]
    ctaLabel = ""
    ctaURL = ""
    searchURL = ""

  [params.footer]
    headline = ""
    aiLabel = ""
    aiURL = ""
    newsletter = false     # newsletter subscription form in the footer

  # Forms (contact, registration, newsletter): see README, "Formulaires".
  # mode "mock": nothing is sent, the whole flow is simulated (an e-mail containing
  # "+error" simulates a failure). mode "live": sent to `endpoint`; a form without
  # endpoint stays simulated (warning at build time).
  [params.forms]
    mode = "mock"
    minDelay = 3           # seconds before a submission is accepted (anti-spam)
    redirectField = ""     # provider field for the no-JS redirection to /merci/ (e.g. "_next")
    privacyURL = ""        # privacy policy, linked under each form (e.g. "/confidentialite/")
    [params.forms.contact]
      endpoint = ""
      method = "POST"
      encoding = "json"    # "json" | "form"
    [params.forms.registration]
      endpoint = ""
      method = "POST"
      encoding = "json"
    [params.forms.newsletter]
      endpoint = ""
      method = "POST"
      encoding = "json"
      doubleOptIn = true   # handled by the provider; only changes the success message
    # Privacy-friendly captcha slot (Turnstile, Friendly Captcha…), disabled when empty.
    [params.forms.captcha]
      provider = ""
      siteKey = ""

  # Internal search (Pagefind, indexed after the build), enabled when header.searchURL is set.
  [params.search]
    bundlePath = "/pagefind/"
    shortcut = true        # Ctrl/⌘ + K opens the search dialog

  # SEO and structured data.
  [params.seo]
    country = "FR"         # ISO 3166 code used in postal addresses (JSON-LD)
    blockRobots = false    # true = whole site closed to robots (noindex + robots.txt), e.g. a preview copy

  # AI crawlers in robots.txt (SPEC § 14): allowed by default.
  [params.aiCrawlers]
    allow = true
    agents = ["GPTBot", "OAI-SearchBot", "ChatGPT-User", "ClaudeBot", "Claude-SearchBot", "Claude-User", "PerplexityBot", "Perplexity-User", "Google-Extended", "Applebot-Extended", "CCBot", "meta-externalagent"]

  # llms.txt / llms-full.txt: sections listed in this order. Each entry:
  # { title, path } (all pages under a section) or { title, types } (content types).
  # Empty = one section per top-level section of the site.
  [params.llms]
    sections = []

  # Syntax highlighting style of code blocks (Chroma style name, light theme).
  [params.code]
    style = "github"

  [params.dev]
    showPlaceholders = false

  # Local fallback font (Arial) adjusted to Geist metrics to limit layout shift.
  # Measured in Edge on 26/09/2026 (canvas measureText, Geist variable 400).
  [params.fontFallback]
    sizeAdjust = "102.54%"
    ascent = "98.5%"
    descent = "29.26%"

  # Couleurs de marque, injectées dans le CSS par @import "hugo:vars".
  # Chaque clé devient une propriété personnalisée : brand → --brand.
  [params.style]
    brand = "#A82234"
    brand-strong = "#8C1C2B"
    ink = "#1A171B"
    accent = "#D42A40"
    accent-on-dark = "#FF6B7F"
    dark-0 = "#131014"
    dark-1 = "#1A171B"
    dark-2 = "#241F25"
    dark-3 = "#2E282F"
    light-1 = "#FFFFFF"
    light-2 = "#FAF7F6"
    text-on-light = "#1A171B"
    body-on-light = "#5C5358"
    muted-on-light = "#8A7F84"
    text-on-dark = "#FFFFFF"
    body-on-dark = "#CAC3C7"
    muted-on-dark = "#A0969B"
