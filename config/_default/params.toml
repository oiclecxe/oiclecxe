# Paramètres propres au site Excelcio.
# Les valeurs par défaut et la documentation de chaque paramètre sont dans themes/excelcio/hugo.toml.

description = "Distributeur et intégrateur à forte valeur ajoutée, Excelcio vous accompagne en pilotage de la performance, autour des meilleures solutions de BI du marché."

[logo]
  default = "images/logo.svg"
  onDark = "images/logo-light.svg"
  compactOnDark = "images/logo-light-compact.svg"
  alt = "Excelcio"

[organization]
  name = "Excelcio"
  legalName = "Excelcio SAS"
  registration = "Société par actions simplifiée au capital de 40 000 € · RCS Paris B 502 851 512 · 113 rue Saint-Maur, 75011 Paris"
  email = "contact@excelcio.com"
  jobsEmail = "rh@excelcio.com"

[header]
  ctaLabel = "Nous contacter"
  ctaURL = "/contact/"
  searchURL = "/recherche/"

# Les trois piliers, affichés sous le titre du hero et rappelés dans le footer.
[[pillars]]
  title = "Conseil."
  text = "Le choix et l’acquisition de vos licences, sans biais : ni éditeur, ni ESN."
[[pillars]]
  title = "Déploiement."
  text = "Des pôles de compétences pour une réponse experte, adaptée à vos contraintes."
[[pillars]]
  title = "Formation."
  text = "Organisme certifié Qualiopi : en intra ou inter-entreprises, sur site ou à distance."

[footer]
  headline = "Transformez votre expérience de la prise de décision."
  aiLabel = "Explorer avec l'IA"
  aiURL = "/llms.txt"
  newsletter = true

# Formulaires : "mock" (simulé, rien n'est envoyé) ou "live" (envoi vers l'endpoint du fournisseur).
# Pour passer en réel : renseigner les endpoints et mode = "live" (voir README, « Formulaires »).
[forms]
  mode = "mock"
  privacyURL = "/confidentialite/"
  [forms.contact]
    endpoint = ""
  [forms.registration]
    endpoint = ""
  [forms.newsletter]
    endpoint = ""

# Appel à l'action en bas des pages intérieures (une page peut le remplacer par `cta:` ou le retirer par `cta: false`).
[cta]
  [cta.title]
    lead = "Vous avez déjà un projet ?"
    rest = "Parlons de vos enjeux et de notre offre."
  [cta.primary]
    label = "Nous contacter"
    url = "/contact/"
  [cta.secondary]
    label = "Découvrir nos formations"
    url = "/formations/"

# llms.txt et llms-full.txt (lisibilité par les agents IA) : rubriques, dans l'ordre.
[[llms.sections]]
  title = "Offre"
  path = "/offre"
[[llms.sections]]
  title = "Solutions"
  types = ["solution"]
[[llms.sections]]
  title = "Formations"
  types = ["training"]
[[llms.sections]]
  title = "Cas clients"
  types = ["case-study"]
[[llms.sections]]
  title = "Ressources"
  types = ["article", "event"]
[[llms.sections]]
  title = "Entreprise"
  types = ["page", "job", "contact"]
